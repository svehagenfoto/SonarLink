<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SonarLink</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #061820;
      overflow: hidden;
    }

    .startup-panel {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(94, 235, 240, 0.12);
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .startup-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 28px 24px;
    }

    .startup-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .status-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 380px;
      -webkit-app-region: no-drag;
    }

    .app-meta,
    .data-root-path {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.6;
      max-width: 360px;
      word-break: break-all;
    }

    .data-root-path {
      display: none;
      text-transform: none;
    }

    .data-root-path.visible {
      display: block;
    }

    .startup-progress {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(10, 40, 50, 0.9);
      border: 1px solid rgba(94, 235, 240, 0.15);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .startup-progress.visible {
      opacity: 1;
    }

    .startup-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(94, 235, 240, 0.5), rgba(94, 235, 240, 0.95));
      box-shadow: 0 0 12px rgba(94, 235, 240, 0.45);
      transition: width 0.2s ease;
    }

    .startup-progress.indeterminate .startup-progress-fill {
      width: 40%;
      animation: startupIndeterminate 1.1s ease-in-out infinite;
    }

    @keyframes startupIndeterminate {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    .folder-block,
    .uninstall-block,
    .uninstall-confirm-block {
      display: none;
      width: 100%;
    }

    .folder-block.visible,
    .uninstall-block.visible,
    .uninstall-confirm-block.visible {
      display: block;
    }

    .folder-btn,
    .uninstall-btn {
      width: 100%;
    }

    .uninstall-confirm-block {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .uninstall-confirm-block.visible {
      display: flex;
    }

    .uninstall-confirm-title {
      margin: 0;
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 200, 200, 0.95);
      text-align: center;
    }

    .uninstall-confirm-detail {
      margin: 0;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      text-align: center;
      max-width: 360px;
    }

    .uninstall-confirm-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .uninstall-confirm-actions .consent-btn {
      flex: 1;
    }

    .status-detail {
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      text-align: center;
      max-width: 360px;
      display: none;
    }

    .status-detail.visible {
      display: block;
    }

    .consent-btn {
      padding: 10px 14px;
      border: 1px solid rgba(160, 190, 200, 0.22);
      border-radius: 999px;
      background: rgba(120, 150, 160, 0.12);
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .consent-btn:hover {
      border-color: rgba(94, 235, 240, 0.45);
      background: rgba(24, 68, 78, 0.55);
    }

    .consent-btn.primary {
      border-color: rgba(245, 166, 35, 0.85);
      background: rgba(245, 166, 35, 0.12);
    }

    .uninstall-btn {
      border-color: rgba(255, 120, 120, 0.35);
      background: rgba(80, 30, 30, 0.2);
      color: rgba(255, 200, 200, 0.85);
    }

    .startup-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <div class="startup-panel" id="root">
    <div class="ocean-bg startup-root">
      <div class="startup-main">
        <div>
          <h1 class="title-sonarlink">SonarLink</h1>
        </div>

        <div class="status-block">
          <div class="status-pill" id="statusPill">
            <div class="status-icon waiting" id="statusIcon">
              <div class="ring"></div>
              <div class="ring"></div>
              <div class="ring"></div>
              <div class="core"></div>
            </div>
            <span class="status-text" id="statusText">CHECKING</span>
            <div class="status-accent"></div>
          </div>

          <p class="status-detail" id="statusDetail"></p>

          <div class="startup-progress" id="startupProgress">
            <div class="startup-progress-fill" id="startupProgressFill"></div>
          </div>

          <div class="folder-block" id="folderBlock">
            <button type="button" class="consent-btn primary folder-btn" id="chooseFolderBtn">CHOOSE FOLDER</button>
          </div>

          <div class="uninstall-confirm-block" id="uninstallConfirmBlock">
            <p class="uninstall-confirm-title">Are you sure you want to delete SonarLink?</p>
            <p class="uninstall-confirm-detail">
              This removes all SonarLink data and mod files from Subnautica 2. Subnautica 2 must be closed.
            </p>
            <div class="uninstall-confirm-actions">
              <button type="button" class="consent-btn" id="uninstallCancelBtn">CANCEL</button>
              <button type="button" class="consent-btn uninstall-btn" id="uninstallConfirmBtn">DELETE</button>
            </div>
          </div>
        </div>
      </div>

      <div class="startup-footer">
        <p class="data-root-path" id="dataRootPath"></p>
        <p class="app-meta" id="appMeta"></p>
        <div class="uninstall-block visible" id="uninstallBlock">
          <button type="button" class="consent-btn uninstall-btn" id="uninstallBtn">DELETE SONARLINK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="startup.js"></script>
</body>
</html>
